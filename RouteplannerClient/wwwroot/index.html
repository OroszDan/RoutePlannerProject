<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Display the fastest route</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <!--<link href="reset.css" rel="stylesheet" />-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="parent">
        <div class="div1">
            <h4>Welcome to the Electric Car Route Planner App!</h4>
        </div>
        <div class="div2, grid-item">
            <label>Select car:</label>
            <select id="carSelect" class="form-select">
                <!--loaded by js-->
            </select>
        </div>
        <div class="div3, grid-item">
            <button id="startButton" type="button" class="btn btn-success">Search route</button>
        </div>
        <div class="div4">
            <div id="map"></div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
